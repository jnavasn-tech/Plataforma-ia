# Contenedor "web" (frontend): sirve /public y reenvía las solicitudes PHP al contenedor "app".
# En producción, la terminación TLS (HTTPS, RNF-03) se configura en este servidor o en el balanceador
# del proveedor (por ejemplo, certificado Let's Encrypt en el VPS de IONOS) [COMPLETAR según el hosting].
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|svg|png|jpg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # Nunca exponer archivos ocultos (.env, .git).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
